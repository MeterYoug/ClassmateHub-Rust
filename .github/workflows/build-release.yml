name: Build release candidates

on: workflow_dispatch

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: '1.95.0'
  NODE_VERSION: '22.16.0'

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: nsis
            extension: exe
          - platform: darwin-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            extension: dmg
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
            extension: deb
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}"
      - name: Install Ubuntu build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xdg-utils
      - run: npm ci
      - name: Build installer
        run: node node_modules/@tauri-apps/cli/tauri.js build --target "${{ matrix.target }}" --no-sign --ci -- --locked
      - name: Run Rust tests
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.platform }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*.${{ matrix.extension }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  assemble:
    name: Assemble release candidates
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: ${{ runner.temp }}/classmatehub-bundles
      - name: Prepare installers, update manifest and checksums
        run: node scripts/prepare-release.mjs "${{ runner.temp }}/classmatehub-bundles" "${{ runner.temp }}/classmatehub-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: ${{ runner.temp }}/classmatehub-release/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
