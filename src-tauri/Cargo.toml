[package]
name = "classmatehub"
version = "0.1.9"
description = "ClassmateHub desktop application"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.38.0"
rust_xlsxwriter = "0.103.0"
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
tempfile = "3.27.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "system-proxy"] }
tokio = { version = "1", features = ["macros", "sync"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
